name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GemmaChat-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmaChat-apk
          path: GemmaChat-${{ github.run_number }}.apk

      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gemma Chat build ${{ github.run_number }}
          prerelease: true
          files: GemmaChat-${{ github.run_number }}.apk
          body: |
            Debug-signed APK built from ${{ github.sha }}.
            Install on an arm64 Android phone (Android 8+). See README for loading the Gemma model.
